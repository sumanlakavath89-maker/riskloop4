<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In · RiskLoop Institutional Risk Platform</title>
  <meta name="description" content="Secure login to access RiskLoop Institutional Trading Terminal, Portfolio Risk Guardrails, and Trading Journal." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://riskloop.io/login.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      background: radial-gradient(circle at 50% 20%, rgba(224, 169, 78, 0.08) 0%, transparent 60%), #0d111d;
      font-family: 'Inter', -apple-system, sans-serif;
      padding: 24px;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    .auth-page-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(224, 169, 78, 0.12) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .auth-standalone-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    .auth-standalone-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
      text-decoration: none;
      color: var(--text);
    }

    .auth-standalone-brand h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.3px;
    }

    .auth-standalone-card {
      background: var(--surface, #141829);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 30px rgba(224, 169, 78, 0.1);
      padding: 32px 28px;
      box-sizing: border-box;
    }

    .auth-standalone-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text, #f0f3fa);
      margin: 0 0 6px 0;
      text-align: center;
    }

    .auth-standalone-sub {
      font-size: 13px;
      color: var(--text-muted, #8b9bb4);
      margin: 0 0 24px 0;
      text-align: center;
    }

    .google-auth-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: #ffffff;
      color: #1f1f1f;
      border: 1px solid #dadce0;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-sizing: border-box;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .google-auth-btn:hover {
      background: #f8f9fa;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      transform: translateY(-1px);
    }

    .auth-divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: var(--text-muted, #8b9bb4);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .auth-divider-line::before,
    .auth-divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border, rgba(255, 255, 255, 0.1));
    }

    .auth-divider-line:not(:empty)::before {
      margin-right: 12px;
    }

    .auth-divider-line:not(:empty)::after {
      margin-left: 12px;
    }

    .auth-standalone-footer {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted, #8b9bb4);
    }

    .auth-standalone-footer a {
      color: var(--accent, #e0a94e);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-standalone-footer a:hover {
      text-decoration: underline;
    }

    .auth-back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted, #8b9bb4);
      text-decoration: none;
      font-size: 12.5px;
      margin-top: 20px;
      transition: color 0.2s ease;
    }

    .auth-back-link:hover {
      color: var(--accent, #e0a94e);
    }
  </style>
</head>
<body>
  <div class="auth-page-glow"></div>

  <div class="auth-standalone-container">
    <a href="index.html#home" class="auth-standalone-brand">
      <div class="brand-mark" style="width:38px;height:38px;border-radius:12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
      </div>
      <h1>RiskLoop</h1>
    </a>

    <div class="auth-standalone-card">
      <h2 class="auth-standalone-title">Welcome Back</h2>
      <p class="auth-standalone-sub">Log in to access your risk terminal &amp; dashboard</p>

      <!-- Google OAuth Button -->
      <button type="button" class="google-auth-btn" id="googleLoginBtn">
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.98 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="auth-divider-line">or continue with email</div>

      <form class="auth-form" id="standaloneLoginForm">
        <div class="support-field">
          <label for="loginEmailInput">Email Address</label>
          <div class="auth-input-wrapper">
            <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="email" id="loginEmailInput" class="auth-input-styled" placeholder="trader@riskloop.io" required autocomplete="email" />
          </div>
        </div>

        <div class="support-field">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <label for="loginPasswordInput">Password</label>
            <a href="javascript:void(0)" id="standaloneForgotPassLink" style="font-size:11.5px;color:var(--accent);text-decoration:none;">Forgot password?</a>
          </div>
          <div class="auth-input-wrapper">
            <svg class="auth-input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="loginPasswordInput" class="auth-input-styled" placeholder="••••••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <div class="auth-remember-row">
          <label class="auth-checkbox-label">
            <input type="checkbox" id="loginRememberMe" checked />
            <span>Keep me signed in</span>
          </label>
        </div>

        <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
          <span>Log In to RiskLoop</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>

        <div class="auth-toast-msg" id="loginToastMsg" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          <span id="loginToastText">Authentication successful! Redirecting...</span>
        </div>
      </form>

      <div class="auth-standalone-footer">
        Don't have an account? <a href="register.html">Register now</a>
      </div>
    </div>

    <div style="text-align:center;">
      <a href="index.html#home" class="auth-back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Back to RiskLoop Home
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('standaloneLoginForm');
      const emailInput = document.getElementById('loginEmailInput');
      const passInput = document.getElementById('loginPasswordInput');
      const submitBtn = document.getElementById('loginSubmitBtn');
      const googleBtn = document.getElementById('googleLoginBtn');
      const forgotPassBtn = document.getElementById('standaloneForgotPassLink');
      const toastMsg = document.getElementById('loginToastMsg');
      const toastText = document.getElementById('loginToastText');

      function showToast(msg, isError = false) {
        if (!toastMsg || !toastText) return;
        toastText.textContent = msg;
        toastMsg.className = isError ? 'auth-toast-msg error' : 'auth-toast-msg';
        toastMsg.hidden = false;
        toastMsg.removeAttribute('hidden');
      }

      async function processLogin() {
        const email = emailInput.value.trim();
        const pass = passInput.value.trim();

        if (!email) {
          showToast('Please enter your email address.', true);
          emailInput.focus();
          return;
        }

        if (!pass) {
          showToast('Please enter your password.', true);
          passInput.focus();
          return;
        }

        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.7';

        if (!window.RiskLoopAuth) {
          showToast('Authentication service is initializing. Please retry in a moment.', true);
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
          return;
        }

        try {
          const { data, error } = await window.RiskLoopAuth.signIn(email, pass);

          if (error) {
            let msg = error.message || 'Login failed. Please check your credentials.';
            if (msg.toLowerCase().includes('invalid login credentials')) {
              msg = 'Invalid credentials. If you previously registered via Google, please sign in with Google or use "Forgot password?" to set an email password.';
            } else if (msg.toLowerCase().includes('email not confirmed')) {
              msg = 'Email not confirmed. Please check your inbox and verify your email before logging in.';
            }
            showToast(msg, true);
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
          } else if (data?.session) {
            showToast('Authentication successful! Opening Dashboard...', false);
            setTimeout(() => {
              window.location.href = 'index.html#dashboard';
            }, 600);
          } else {
            showToast('Please verify your email before logging in.', true);
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
          }
        } catch (err) {
          showToast('Unexpected error during login. Please try again.', true);
          submitBtn.disabled = false;
          submitBtn.style.opacity = '1';
        }
      }

      if (loginForm) {
        loginForm.addEventListener('submit', function (e) {
          e.preventDefault();
          processLogin();
        });
      }

      if (submitBtn) {
        submitBtn.addEventListener('click', function (e) {
          e.preventDefault();
          processLogin();
        });
      }

      // Handle Forgot Password
      if (forgotPassBtn) {
        forgotPassBtn.addEventListener('click', async function (e) {
          e.preventDefault();
          const email = emailInput.value.trim() || prompt('Enter your email address to receive a password setup link:');
          if (!email) return;
          showToast('Sending password reset / setup link to ' + email + '...', false);
          if (window.RiskLoopAuth) {
            const { error } = await window.RiskLoopAuth.resetPasswordForEmail(email);
            if (error) {
              showToast(error.message || 'Failed to send reset link.', true);
            } else {
              showToast('Password setup link sent to ' + email + '! Check your inbox.', false);
            }
          }
        });
      }

      // Handle Google OAuth Login
      if (googleBtn) {
        googleBtn.addEventListener('click', async function () {
          if (!window.RiskLoopAuth) {
            showToast('Authentication service is initializing...', true);
            return;
          }
          showToast('Redirecting to Google for authentication...', false);
          try {
            const { error } = await window.RiskLoopAuth.signInWithGoogle();
            if (error) {
              showToast(error.message || 'Google authentication failed.', true);
            }
          } catch (err) {
            showToast('Google Sign-In encountered an error.', true);
          }
        });
      }
    });
  </script>
</body>
</html>
